name: Licences

on:
  schedule:
    # Mondays at 06:00 UTC — catches `Licenses.generated.swift` up with whatever moved in the
    # resolved graph over the past week. Nothing gates a build on the file being current, and
    # nothing should: forgetting `just licences` after a re-pin is the expected failure, not a
    # thing to punish a build for. This is the mechanism that makes forgetting harmless.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: licences
  cancel-in-progress: true

# Read only, and tighter than SimpleTrackerForAniList's — deliberately, because this repo is
# public. `GITHUB_TOKEN` covers the checkout and nothing else: the branch push, the commit and
# the pull request are all made with the App token below, which carries its own `contents: write`
# and `pull-requests: write`. Granting write here as well would widen what every step in a public
# workflow run can do, to buy nothing.
permissions:
  contents: read

jobs:
  update:
    name: Update acknowledgements licences
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # `brew install` rather than SimpleTrackerForAniList's `brew bundle`, because this repo has
      # no Brewfile. `just` is all this job needs — the recipe runs the generator through the same
      # two commands a human would, so the workflow cannot drift from what regeneration means.
      - name: Install tools
        run: brew install just

      # `pointfreeco/TCA26` is a **private** repository — the Point-Free beta this app is pinned
      # to for `StoreActor` (ADR-0001) — so `swift package resolve` cannot clone it anonymously
      # and the job dies before it reaches the generator. Every other pin is public.
      #
      # A classic PAT rather than the fine-grained kind SimpleTrackerForAniList uses for its own
      # private packages: a fine-grained token can only grant repositories owned by its resource
      # owner, and this one belongs to `pointfreeco`. Access comes from the authenticated user's
      # own membership, which only a classic `repo`-scoped token carries.
      #
      # **That breadth is why the credential is handed over in the environment rather than written
      # to `~/.gitconfig`.** A `repo`-scoped classic token reads every private repository its owner
      # can, so a copy sitting in the runner's git config would stay readable by every later step —
      # including the two third-party actions below — for the rest of the job. `GIT_CONFIG_*` is
      # scoped to this step alone, so the token never touches disk and there is no cleanup to skip
      # on a failure path. `swift package resolve` shells out to `git`, which inherits it.
      #
      # Scoped to that one repository, as the sibling scopes its own. A blanket rewrite of
      # `https://github.com/` would also capture the `create-pull-request` push below and send it
      # out under this token instead of the app's.
      - name: Regenerate licences
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SPM_TOKEN }}@github.com/pointfreeco/TCA26.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/pointfreeco/TCA26
        run: just licences

      # A GitHub App token rather than GITHUB_TOKEN, matching SimpleTrackerForAniList. Neither of
      # the reasons that repo needs one applies here *yet* — this repo has no ruleset requiring
      # signed commits, and no CI workflow that a GITHUB_TOKEN-authored PR would fail to trigger —
      # so this is consistency across the two repos bought ahead of need, deliberately.
      #
      # `LICENCES_APP_ID` and `LICENCES_APP_PRIVATE_KEY` are set on this repo, and the
      # `brzzdev-licences` app is installed on it with `contents: write` + `pull-requests: write`.
      # Secrets are per-repository here rather than inherited: `brzzdev` is a user account, not an
      # organisation, so there is no org-level secret for a new repo to pick these up from.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LICENCES_APP_ID }}
          private-key: ${{ secrets.LICENCES_APP_PRIVATE_KEY }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The generated file alone. `swift package resolve` honours the committed pins rather
          # than moving them, so `Package.resolved` should not change — and if it ever does, that
          # is a dependency bump wanting its own PR, not a passenger on this one.
          add-paths: Sources/Acknowledgements/Licenses.generated.swift
          branch: chore/update-licences
          commit-message: "chore(acknowledgements): update third-party licences"
          # Commits through the GitHub API so the commit lands signed as the app's bot user.
          sign-commits: true
          title: "chore(acknowledgements): update third-party licences"
          body: |
            Automated weekly regeneration of `Licenses.generated.swift` from the resolved
            Swift package graph on `main`. No-op weeks open no PR.
