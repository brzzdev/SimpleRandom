deployment_target:
  iOS_deployment_target: 26.0

excluded:
  - "*.generated.swift"
  - "**/.build"
  - Derived

custom_rules:
  # Every user-facing literal must carry `bundle: #bundle`. SwiftUI resolves a string
  # against `Bundle.main` unless told otherwise, and every string in this app lives in a
  # package target — so without the argument the lookup leaves the target's own bundle and
  # finds nothing. In an English-only build the miss is invisible: SwiftUI falls through to
  # the key and the right words render anyway. Xcode's extraction is no help either, since
  # it scans source literals rather than runtime lookups, so a full catalogue is not
  # evidence of correct wiring.
  #
  # The enumerated call sites are the decision, and they live in `CONTEXT.md` under
  # "Enforcing the bundle argument" — this is the tooling that carries it. Reaching past
  # `Text` is the point: `Text` is a minority of this app's strings, and the VoiceOver
  # announcements are not `Text` at all.
  #
  # Where an API has no `bundle:` parameter of its own — `Button`, `Label`,
  # `navigationTitle`, `Picker`, `Section`, `Toggle` — the fix is to hand it a `Text` that
  # does, rather than a bare literal. That form does not match this rule.
  #
  # Three things the pattern is deliberate about:
  #
  # - The required expression is matched exactly, not merely the presence of a `bundle:`
  #   label. `bundle: .main` and `bundle: nil` are precisely the wiring this exists to
  #   catch, and both satisfy a laxer check while resolving against the wrong bundle.
  # - The optional `localized:` label lets the pattern reach `AttributedString(localized:)`,
  #   whose literal is not the first argument. That call site exists because a dialog title
  #   is extracted as a plain string for `UIAlertController` and runs no morphology pass, so
  #   a `Text` holding `^[…](inflect: true)` renders the markup — it is the only way to get
  #   automatic grammar agreement into an alert or a dialog, and so is not a one-off.
  #   It is the one entry whose literal is not the first argument, so it gets a branch of
  #   its own in which `localized:` is **required** rather than a label the other twelve
  #   may optionally carry. Made optional, the pattern also matches
  #   `AttributedString("some markdown")` — a perfectly ordinary non-localised initialiser
  #   with no `bundle:` parameter to add, so the violation would have no fix but
  #   `swiftlint:disable`. That is the same false-positive trap as the `[^()]*` lookahead
  #   below, and it is refused for the same reason.
  # - `#*` around the literal catches raw strings, so `Text(#"…"#)` is not a way past.
  # - The lookahead steps over one level of balanced parentheses, so an argument like
  #   `tableName: table()` between the literal and `bundle:` does not make a correct call
  #   look like a violation. A stricter `[^()]*` did exactly that, and a false positive at
  #   `error` severity is worse than the miss it prevents.
  #
  # The residual risk is named in `CONTEXT.md` and accepted: a source-level rule cannot see
  # a runtime lookup, so a string that escapes these call sites escapes the check. Nor can
  # it defeat deliberate circumvention — `Text("…" /* bundle: #bundle */)` reads as
  # satisfied — but that is what `swiftlint:disable` is for, and neither is an accident
  # anyone makes.
  localised_string_needs_bundle:
    name: "Localised string needs a bundle"
    regex: '(?:\b(?:accessibilityLabel|AccessibilityNotification\.Announcement|accessibilityValue|alert|Button|confirmationDialog|Label|navigationTitle|Picker|Section|Text|Toggle)\(\s*|\bAttributedString\(\s*localized:\s*)#*"(?:[^"\\]|\\.)*"#*(?!(?:[^()]|\([^()]*\))*bundle:\s*#bundle\b)'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Pass `bundle: #bundle`, or hand this call a `Text(_:bundle:)` — every string in this app lives in a package target, and without it the lookup goes to `Bundle.main` and silently misses."
    severity: error
